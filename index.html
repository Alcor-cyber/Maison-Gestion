<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison | Thomas & Christelle</title>
    <meta
      name="description"
      content="Pilotage partage de la maison pour Thomas et Christelle : taches, courses, cuisine, calendrier, vacances et projets."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-lockup reveal">
          <p class="eyebrow">Maison connectee</p>
          <h1>Thomas & Christelle</h1>
          <p class="sidebar-copy">
            Un seul espace pour suivre ce qui bouge dans la maison, a deux.
          </p>
        </div>

        <nav class="nav reveal" aria-label="Navigation principale">
          <button class="nav-link active" data-view="dashboard">Tableau de bord</button>
          <button class="nav-link" data-view="tasks">Taches a faire</button>
          <button class="nav-link" data-view="shopping">Liste de courses</button>
          <button class="nav-link" data-view="cuisine">Cuisine</button>
          <button class="nav-link" data-view="calendar-page">Calendrier</button>
          <button class="nav-link" data-view="vacations">Vacances</button>
          <button class="nav-link" data-view="projects">Projets</button>
        </nav>

      </aside>

      <div class="main-panel">
        <header class="topbar reveal">
          <div>
            <p class="eyebrow">Aujourd'hui</p>
            <p id="currentDate" class="topbar-date"></p>
          </div>

          <div class="profile-switch-wrap">
            <p class="eyebrow">Profil actif</p>
            <div id="profileSwitch" class="profile-switch" aria-label="Choisir un profil"></div>
          </div>
        </header>

        <main class="workspace">
          <section class="hero reveal">
            <div>
              <p class="eyebrow">Vue centrale</p>
              <h2 id="heroTitle">Tableau de bord</h2>
            </div>
            <p id="heroSubtitle" class="hero-copy"></p>
            <div id="heroMeta" class="hero-meta"></div>
          </section>

          <section id="pageContent" class="page-content" aria-live="polite"></section>
        </main>
      </div>
    </div>

    <button class="admin-fab" type="button" data-action="open-admin-gate" aria-label="Ouvrir l'administration">
      &#128274;
    </button>

    <noscript>Cette application a besoin de JavaScript pour fonctionner.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.1/dist/jspdf.umd.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
