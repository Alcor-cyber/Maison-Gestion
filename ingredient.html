<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingredients | Thomas & Christelle</title>
    <meta
      name="description"
      content="Creation d'ingredients et base de stock pour la cuisine de la maison."
    />
    <meta name="theme-color" content="#4fa166" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maison" />
    <link rel="icon" type="image/png" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="ingredient">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-lockup reveal">
          <p class="eyebrow">Base cuisine</p>
          <h1>Thomas & Christelle</h1>
          <p class="sidebar-copy">
            Ajoutez les ingredients une fois, puis reutilisez-les dans les recettes et le stock.
          </p>
        </div>

        <nav class="nav reveal" aria-label="Navigation principale">
          <button class="nav-link" data-view="dashboard">Tableau de bord</button>
          <button class="nav-link" data-view="tasks">Taches a faire</button>
          <button class="nav-link" data-view="shopping">Liste de courses</button>
          <button class="nav-link active" data-view="cuisine">Cuisine</button>
          <button class="nav-link" data-view="calendar-page">Calendrier</button>
          <button class="nav-link" data-view="vacations">Vacances</button>
          <button class="nav-link" data-view="projects">Projets</button>
        </nav>

      </aside>

      <div class="main-panel">
        <header class="topbar reveal">
          <div>
            <p class="eyebrow">Aujourd'hui</p>
            <p id="currentDate" class="topbar-date"></p>
          </div>

          <div class="profile-switch-wrap">
            <p class="eyebrow">Profil actif</p>
            <div id="profileSwitch" class="profile-switch" aria-label="Choisir un profil"></div>
          </div>
        </header>

        <main class="workspace">
          <section class="hero reveal">
            <div>
              <p class="eyebrow">Page dediee</p>
              <h2 id="heroTitle">Nouvel ingredient</h2>
            </div>
            <p id="heroSubtitle" class="hero-copy"></p>
            <div id="heroMeta" class="hero-meta"></div>
          </section>

          <section id="pageContent" class="page-content" aria-live="polite"></section>
        </main>
      </div>
    </div>

    <button class="admin-fab" type="button" data-action="open-admin-gate" aria-label="Ouvrir l'administration">
      &#128274;
    </button>

    <noscript>Cette application a besoin de JavaScript pour fonctionner.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.1/dist/jspdf.umd.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
